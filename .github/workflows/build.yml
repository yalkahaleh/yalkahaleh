name: Build APK

on:
  push:
    branches: [main, ccr-c5f2353d-wwk9ys]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk masroof.apk
      - uses: actions/upload-artifact@v4
        with:
          name: masroof-apk
          path: masroof.apk
      # Keep one always-current download link for installing on the phone.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --target "$GITHUB_SHA" --title "Masroof latest build" --notes "Rebuilt on every push."
          gh release upload latest masroof.apk --clobber
